<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Diary</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            padding: 2rem;
            box-sizing: border-box;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Hiragino Sans",
                "Yu Gothic",
                sans-serif;

            line-height: 1.8;
        }

        main {
            max-width: 40rem;
        }
    </style>
</head>

<body>
    <main>
        <p>
            <time datetime="2026-11-01">2026/11/01</time>
        </p>

        <p>
            もう11月ダァ、待ってグループ展まであとちょっとやん、<br>
            あとあと横浜行くのも後ちょっとやん、<br>
            早いねぇ、楽しみだねぇ、今日は散歩した
        </p>

        <p>
            色<br>
            オレンジ、ピンク
        </p>
    </main>
</body>
</html>
